<style>
:root{--bg:#0c0d16;--s1:#151726;--s2:#1e2136;--tx:#eceaff;--mu:#8b8fb0;--pro:#7c8cff;--per:#ff7a9c;--stu:#3ee6b0;--acc:#b78cff;--must:#ffc46b;--good:#3ee6b0;--okay:#ffc46b;--fail:#f0616d;--other:#ff9ec4;--glow:rgba(183,140,255,.28);--ring:var(--acc);color-scheme:dark}
[data-theme="midnight"]{--bg:#070b12;--s1:#0e1724;--s2:#142337;--tx:#eaf6ff;--mu:#7893aa;--acc:#35bfff;--glow:rgba(53,191,255,.28)}
[data-theme="purple"]{--bg:#0c0814;--s1:#171022;--s2:#251638;--tx:#f4eaff;--mu:#9b87b7;--acc:#b56cff;--glow:rgba(181,108,255,.30)}
[data-theme="matrix"]{--bg:#050b08;--s1:#0c1711;--s2:#12251a;--tx:#e7fff0;--mu:#719b80;--acc:#39e67a;--glow:rgba(57,230,122,.25)}
[data-theme="gold"]{--bg:#0b0b09;--s1:#171611;--s2:#252217;--tx:#f7f2e4;--mu:#a99e82;--acc:#d7ad45;--glow:rgba(215,173,69,.28)}
[data-theme="arctic"]{--bg:#071017;--s1:#0d1c27;--s2:#132b3a;--tx:#e8fbff;--mu:#789eab;--acc:#42d9ff;--glow:rgba(66,217,255,.28)}
[data-theme="crimson"]{--bg:#100709;--s1:#1d0d11;--s2:#301319;--tx:#ffecef;--mu:#aa7d84;--acc:#ff4f68;--glow:rgba(255,79,104,.28)}
[data-mode="light"]{--bg:#f2f4f8;--s1:#ffffff;--s2:#e8ebf1;--tx:#151923;--mu:#687080;--glow:rgba(0,0,0,.12);color-scheme:light}

*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
[hidden]{display:none!important}
body{margin:0;min-height:100vh;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:radial-gradient(900px 500px at 85% -10%,var(--glow),transparent 55%),radial-gradient(700px 400px at -10% 30%,var(--glow),transparent 50%),var(--bg);color:var(--tx);font:15px/1.5 Sora,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;transition:background .35s,color .25s}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.app{max-width:1000px;margin:0 auto;padding:20px 16px 60px;display:grid;gap:16px}
header{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;flex:none;width:138px;height:50px;margin:0 auto 0 0;overflow:hidden}
.brand img{display:block;width:100%;height:100%;object-fit:contain;object-position:left center;transition:filter .25s,opacity .25s}
html:not([data-mode="light"]) .brand img{filter:invert(1)}
@media(max-width:700px){.brand{width:112px;height:42px}}
h1{font-size:22px;margin:0 auto 0 0;font-weight:700;letter-spacing:-.02em}
h2,h3{margin:0;font-weight:600}
h2{font-size:17px}h3{font-size:16px}
.tabs{display:flex;gap:4px;background:var(--s1);padding:4px;border-radius:99px;border:1px solid rgba(255,255,255,.05);box-shadow:0 4px 18px rgba(0,0,0,.14)}
.tb{padding:7px 16px;border-radius:99px;color:var(--mu);font-size:14px}
.tb.on{background:var(--acc);color:#101018;font-weight:700;box-shadow:0 0 18px var(--glow)}
.chip{padding:6px 12px;border-radius:99px;background:var(--s1);color:var(--mu);font-size:13px;border:1px solid transparent}
.chip.on{color:var(--tx);border-color:var(--c,var(--acc));background:var(--s2)}
.exs{display:flex;gap:8px;flex-wrap:wrap}
.exs .chip{background:var(--s2);color:var(--tx)}
.exs b{color:var(--acc)}
.card{background:linear-gradient(145deg,var(--s1),var(--s1));border:1px solid rgba(255,255,255,.045);box-shadow:0 12px 32px rgba(0,0,0,.14);border-radius:20px;padding:16px;transition:border-color .25s,box-shadow .25s,transform .2s}.card:hover{border-color:var(--glow);box-shadow:0 14px 38px rgba(0,0,0,.18),0 0 24px var(--glow)}
.mh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.nav button,.arr{width:34px;height:34px;border-radius:50%;background:var(--s2);font-size:16px}
.wd,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wd span{text-align:center;color:var(--mu);font-size:12px;padding:4px 0}
.wd .a{display:none}
.dc{aspect-ratio:1;min-width:0;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:var(--s2);border:1px solid transparent;overflow:hidden;padding:2px}
.dc b{font-weight:600;font-size:14px}
.dc.out{opacity:.35}
.dc.today b{color:var(--acc)}
.dc.sel{outline:2px solid var(--acc);box-shadow:0 0 18px var(--glow)}
.dc .dots{display:flex;gap:3px;height:6px}
.dc .dots i{width:6px;height:6px;border-radius:50%;display:block}
.dc small{font-size:10.5px;color:var(--mu);line-height:1.2;white-space:nowrap}
.s-good{background:rgba(62,230,176,.15);border-color:rgba(62,230,176,.45)}
.s-okay{background:rgba(255,196,107,.14);border-color:rgba(255,196,107,.45)}
.s-fail{background:rgba(240,97,109,.15);border-color:rgba(240,97,109,.45)}
.s-other{background:rgba(255,158,196,.16);border-color:rgba(255,158,196,.45)}
.two{display:grid;gap:16px}
@media(min-width:820px){.two{grid-template-columns:1.2fr 1fr;align-items:start}}
.stack{display:grid;gap:16px}
.pbar{position:relative;height:12px;background:var(--s2);border-radius:99px;overflow:hidden;margin:10px 0 6px}
.pbar div{height:100%;width:0;background:linear-gradient(90deg,var(--pro),var(--stu));border-radius:99px}
.pbar .mk{position:absolute;top:0;bottom:0;width:2px;background:var(--tx);opacity:.7}
@media(prefers-reduced-motion:no-preference){.pbar div{transition:width .3s}}
.ach{display:flex;align-items:center;gap:12px}
.ach input[type=range]{flex:1;min-width:0;accent-color:var(--acc);padding:0;border:0;background:none}
.ach output{min-width:50px;text-align:right;font-weight:700;font-size:18px}
.unset{opacity:.5}
.note{padding:10px 12px;border-radius:12px;background:var(--s2);font-size:14px;margin-top:8px}
.add{background:var(--acc);color:#101018;padding:7px 14px;border-radius:99px;font-weight:700;font-size:13px;box-shadow:0 0 16px var(--glow);transition:transform .18s,box-shadow .18s}.add:hover{transform:translateY(-1px);box-shadow:0 0 24px var(--glow)}
.ghost{padding:7px 12px;color:var(--mu);border-radius:99px;background:var(--s2);font-size:13px;border:1px solid transparent}
.ghost.on,.ghost[aria-pressed=true]{color:var(--tx);border-color:var(--acc);box-shadow:0 0 12px var(--glow)}
.ghost.dng{color:#f4a0a8}
.ghost.sm{padding:3px 10px;font-size:12px}
ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.task{display:flex;align-items:center;gap:8px;padding:9px 10px;background:var(--s2);border-radius:12px;border-left:4px solid var(--pro);flex-wrap:wrap}
.task.must{border-color:var(--must)}.task.bonus{border-color:var(--stu)}
.task input[type=checkbox]{accent-color:var(--stu);width:18px;height:18px;flex:none}
.task .lb{flex:1;min-width:120px;display:flex;align-items:center;gap:10px;overflow-wrap:anywhere}
.task small{color:var(--mu)}
.task.done .lb span{text-decoration:line-through;color:var(--mu)}
.task.done{opacity:.75}
.x{color:var(--mu);font-size:20px;line-height:1;padding:4px 8px;border-radius:8px}
.x:hover{color:var(--per)}
.sec{margin-top:14px}
.sec>h3{margin-bottom:8px;font-size:14px;color:var(--mu)}
.empty{color:var(--mu);font-size:14px}
.hint{font-size:12px;color:var(--mu);margin:8px 0 0}
.tl li{display:grid;grid-template-columns:48px 1fr;gap:8px;font-size:13px;align-items:start;min-height:26px}
.tl li>span{color:var(--mu)}
.tl em{color:#4a4e70;font-style:normal}
.tl .ev{display:flex;justify-content:space-between;align-items:center;gap:6px;font-weight:600;background:var(--s2);border-left:4px solid var(--c);border-radius:8px;padding:2px 4px 2px 8px;margin-bottom:4px}
.tl .ev button.t{flex:1;text-align:left;padding:4px 0;min-width:0}
.tl .ev small{display:block;color:var(--mu);font-weight:400}
.frm{display:grid;grid-template-columns:1fr auto auto;gap:6px;margin-bottom:8px}
@media(max-width:560px){.frm{grid-template-columns:1fr 1fr}.frm input[type=text]{grid-column:1/-1}.wd .f{display:none}.wd .a{display:inline}.dc small{display:none}.tb{padding:7px 12px}}
input[type=text],input[type=date],input[type=time],input[type=number],select,textarea{padding:9px 11px;border-radius:10px;border:1px solid var(--s2);background:var(--bg);min-width:0}
textarea{width:100%;min-height:72px;resize:vertical}
dialog{background:var(--s1);color:var(--tx);border:1px solid var(--s2);border-radius:20px;padding:20px;width:min(92vw,420px)}
dialog::backdrop{background:#000a}
dialog h3{margin-bottom:12px}
label.f{display:block;font-size:13px;color:var(--mu);margin-bottom:10px}
.f input,.f select,.f textarea{display:block;width:100%;margin-top:4px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cats{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.btns{display:flex;justify-content:flex-end;gap:8px;margin-top:6px;flex-wrap:wrap}
.wrap{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.setm{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.theme-controls{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.theme-select{padding:7px 10px;border-radius:99px;border:1px solid rgba(255,255,255,.07);background:var(--s1);color:var(--tx);font-size:12px;max-width:155px}.mode-btn{min-width:34px}.accent-picker{width:34px;height:34px;padding:3px;border-radius:50%;background:var(--s1);border:1px solid rgba(255,255,255,.08)}.accent-picker input{width:100%;height:100%;padding:0;border:0;background:none;border-radius:50%;cursor:pointer}.today-mini{display:flex;align-items:center;gap:8px;padding:5px 9px;border-radius:99px;background:var(--s1);border:1px solid rgba(255,255,255,.05);font-size:12px;color:var(--mu)}.ring{width:58px;height:58px;position:relative;flex:none}.ring svg{width:100%;height:100%;transform:rotate(-90deg)}.ring circle{fill:none;stroke-width:7}.ring .track{stroke:var(--s2)}.ring .fill{stroke:var(--ring);stroke-linecap:round;filter:drop-shadow(0 0 5px var(--glow));transition:stroke-dashoffset .35s}.ring .rtext{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;font-weight:800}.today-mini .ring{width:36px;height:36px}.today-mini .ring circle{stroke-width:6}.today-mini .ring .rtext{font-size:9px}.day-progress{display:flex;align-items:center;gap:14px;margin:4px 0 12px;padding:10px 12px;border-radius:16px;background:var(--s2);border:1px solid rgba(255,255,255,.045)}.day-progress .ring{width:74px;height:74px}.day-progress-copy{min-width:0}.day-progress-copy strong{display:block;font-size:14px}.day-progress-copy span{display:block;color:var(--mu);font-size:12px}.mobile-nav{display:none}
#toast{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:460px;margin:0 auto;z-index:99;background:var(--acc);color:#14102a;padding:10px 12px;border-radius:14px;font-weight:600;opacity:0;transform:translateY(12px);pointer-events:none;transition:opacity .2s,transform .2s;display:flex;align-items:center;gap:10px;justify-content:space-between}#toastMsg{flex:1}#toastUndo{background:#14102a;color:var(--acc);padding:6px 10px;border-radius:9px;font-weight:700;font-size:12px}
#toast.on{opacity:1;transform:none}
@media(prefers-reduced-motion:no-preference){.card,.task,.dc{animation:softIn .22s ease both}@keyframes softIn{from{opacity:.72;transform:translateY(3px)}to{opacity:1;transform:none}}}.mobile-nav{display:none}@media(max-width:700px){.app{padding:14px 12px 88px}header{gap:7px}.tabs{order:4;width:100%;justify-content:space-between}.tb{flex:1}.theme-controls{width:100%;justify-content:space-between}.theme-select{flex:1;max-width:none}.today-mini{margin-left:auto}.mobile-nav{position:fixed;left:10px;right:10px;bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:90;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:6px;border:1px solid rgba(255,255,255,.08);background:color-mix(in srgb,var(--s1) 92%,transparent);backdrop-filter:blur(18px);border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.3)}.mobile-nav button{padding:9px 4px;border-radius:12px;color:var(--mu);font-size:11px}.mobile-nav button.on{background:var(--s2);color:var(--tx);box-shadow:0 0 14px var(--glow)}.tabs{display:none}.dc{border-radius:10px}.day-progress{padding:9px}.row{grid-template-columns:1fr}.frm{grid-template-columns:1fr 1fr}.frm .add{grid-column:2}.wd .f{display:none}.wd .a{display:inline}.theme-controls .accent-picker{display:none}}@media(prefers-reduced-motion:reduce){#toast{transition:none}.card,.task,.dc{animation:none!important}.card,.add,body{transition:none!important}}
</style>

<script>
(function(){
'use strict';

/* ===== CONSTANTS ===== */
const KEY='planner-v2', LEGACY_KEY='planner-v1', BACKUP_KEY='planner-v2-backup', DEF_TARGET=25, SCHEMA_VERSION=2;
const PR=['must','should','bonus'], PRL={must:'Must',should:'Should',bonus:'Bonus'};
const CAT={Professional:'#7c8cff',Personal:'#ff7a9c',Study:'#3ee6b0'};
const CATS=Object.keys(CAT);
const DOWN=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const ST={good:'Good day',okay:'Okayish day',fail:'Failure day',other:'Other day',neutral:'Not recorded'};
const REMS=[['','No reminder'],['0','At start time'],['5','5 minutes before'],['10','10 minutes before'],['30','30 minutes before'],['60','1 hour before']];

/* ===== HELPERS ===== */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);

/* ===== DATE UTILITIES ===== */
const p2=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
const parse=k=>{const a=k.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])};
const today=()=>ymd(new Date());
const addDays=(k,n)=>{const d=parse(k);d.setDate(d.getDate()+n);return ymd(d)};
const mkey=k=>k.slice(0,7);
const shiftMonth=(mk,n)=>{const a=mk.split('-').map(Number);return ymd(new Date(a[0],a[1]-1+n,1)).slice(0,7)};
const monIdx=k=>(parse(k).getDay()+6)%7;
const daysUntil=k=>Math.round((parse(k)-parse(today()))/864e5);
const longDate=k=>{const d=parse(k);return d.getDate()+' '+MONTHS[d.getMonth()]+' '+d.getFullYear()};
const monthName=mk=>{const a=mk.split('-').map(Number);return MONTHS[a[1]-1]+' '+a[0]};
const endT=(t,m)=>{const a=t.split(':').map(Number),x=(a[0]*60+a[1]+m)%1440;return p2(Math.floor(x/60))+':'+p2(x%60)};
const dayText=n=>n>1?n+' days':n===1?'1 day':n===0?'Today':(-n)+' day'+(n===-1?'':'s')+' ago';

/* ===== STATE ===== */
const blank=()=>({version:SCHEMA_VERSION,days:{},tasks:[],events:[],routines:[],exams:[],backlog:[],monthlyTargets:{}});
const newDay=()=>({achievement:null,other:false,light:false,notes:'',win:'',missed:'',tomorrow:''});
let S=blank(), warn='';
let storeOK=(function(){try{localStorage.setItem('__t','1');localStorage.removeItem('__t');return true}catch(e){return false}})();
let view='month', sel=today(), cur=mkey(sel), lastPrio='should', filt='all', evCat='Professional';
const THEME_KEY='planner-theme-v1';
let themePrefs={theme:'midnight',mode:'dark',accent:''};

/* ===== STORAGE ===== */
function normalizeData(o){
  if(!o||typeof o!=='object'||Array.isArray(o)) throw new Error('bad');
  const b=blank();
  ['tasks','events','routines','exams','backlog'].forEach(k=>{if(Array.isArray(o[k]))b[k]=o[k]});
  ['days','monthlyTargets'].forEach(k=>{if(o[k]&&typeof o[k]==='object'&&!Array.isArray(o[k]))b[k]=o[k]});
  return b;
}
function load(){
  if(!storeOK) return blank();
  let raw=null,sourceKey=KEY;
  try{
    raw=localStorage.getItem(KEY);
    if(!raw){raw=localStorage.getItem(LEGACY_KEY);sourceKey=LEGACY_KEY}
    if(!raw) return blank();
    const b=normalizeData(JSON.parse(raw));
    if(sourceKey===LEGACY_KEY){try{localStorage.setItem(KEY,JSON.stringify(b))}catch(_){}}
    return b;
  }catch(e){
    warn='Saved data could not be read, so the planner started clean.';
    try{if(raw)localStorage.setItem(KEY+'-corrupt-backup',raw)}catch(_){}
    return blank();
  }
}
function save(){
  if(!storeOK) return false;
  try{localStorage.setItem(KEY,JSON.stringify(S));return true}catch(e){return false}
}
function commit(msg){
  const ok=save();
  render();
  if(msg)toast(ok?msg:'Could not save changes. Your browser storage may be unavailable.');
  return ok;
}
function cloneState(o){return JSON.parse(JSON.stringify(o))}
let undoState=null,undoLabel='';
function rememberUndo(label){
  undoState=cloneState(S);
  undoLabel=label||'Previous state';
  if(storeOK){try{localStorage.setItem(BACKUP_KEY,JSON.stringify({version:SCHEMA_VERSION,label:undoLabel,state:undoState,at:Date.now()}))}catch(_) {}}
}
function restoreUndo(){
  let state=undoState;
  if(!state&&storeOK){try{const b=JSON.parse(localStorage.getItem(BACKUP_KEY)||'null');if(b&&b.state)state=b.state}catch(_){}}
  if(!state){toast('No undo backup is available.');return}
  S=normalizeData(state);
  const ok=save();
  render();
  if(ok){undoState=null;toast('Undo complete')}else toast('Undo could not be saved.');
}

/* ===== DAY / STATUS (read-only) ===== */
const target=mk=>(typeof S.monthlyTargets[mk]==='number'?S.monthlyTargets[mk]:DEF_TARGET);
function status(k){
  const d=S.days[k];
  if(!d) return 'neutral';
  if(d.other===true) return 'other';
  if(d.achievement===null||typeof d.achievement!=='number') return 'neutral';
  if(d.achievement===0) return 'fail';
  return d.achievement>=target(mkey(k))?'good':'okay';
}
function ensureDay(k){if(!S.days[k])S.days[k]=newDay();return S.days[k]}

/* ===== TASK FUNCTIONS ===== */
function addTask(title,priority,date,extra){
  title=(title||'').trim();
  if(!title) return false;
  S.tasks.push(Object.assign({id:uid(),title:title,date:date||sel,priority:PR.indexOf(priority)>-1?priority:'should',completed:false},extra||{}));
  return true;
}

/* ===== ROUTINE FUNCTIONS (explicit only) ===== */
function generateRoutine(k){
  const w=monIdx(k), list=S.routines.filter(r=>Array.isArray(r.daysOfWeek)&&r.daysOfWeek.indexOf(w)>-1);
  if(!list.length){toast('No routine items for '+DOWN[w]+'.');return}
  let n=0;
  list.forEach(r=>{
    if(S.tasks.some(t=>t.routineId===r.id&&t.date===k)) return;
    addTask(r.title,'should',k,{routineId:r.id});n++;
  });
  if(n) commit('Added '+n+' routine task'+(n>1?'s':'')); else toast('Routine is already on this day.');
}

/* ===== BACKLOG FUNCTIONS ===== */
function moveBacklog(id,date){
  const b=S.backlog.find(x=>x.id===id);
  if(!b) return;
  addTask(b.title,b.priority,date);
  S.backlog=S.backlog.filter(x=>x.id!==id);
  commit('Task added to '+(date===today()?'today':longDate(date)));
}

/* ===== ACHIEVEMENT ===== */
function setAchievement(v){ensureDay(sel).achievement=v;commit()}

/* ===== RESET FUNCTIONS ===== */
function verifyDayEmpty(k){
  try{
    const o=JSON.parse(localStorage.getItem(KEY)||'null'),d=o&&o.days&&o.days[k];
    return !!o&&!o.tasks.some(t=>t.date===k)&&!o.events.some(e=>e.date===k)&&!!d&&d.achievement===null&&!d.other&&!d.light&&!d.notes&&!d.win&&!d.missed&&!d.tomorrow;
  }catch(e){return false}
}
function verifyMonthEmpty(mk){
  try{
    const o=JSON.parse(localStorage.getItem(KEY)||'null');
    if(!o)return false;
    return !o.tasks.some(t=>mkey(t.date)===mk)&&!o.events.some(e=>mkey(e.date)===mk)&&!Object.keys(o.days||{}).some(k=>mkey(k)===mk);
  }catch(e){return false}
}
function resetDay(){
  const k=sel;
  ask({title:'Reset this day?',msg:'This will remove all tasks, events, achievement and notes for this day. A temporary backup will be created so you can Undo.',ok:'Reset day',cb:()=>{
    rememberUndo('Day reset');
    const before=cloneState(S);
    S.tasks=S.tasks.filter(t=>t.date!==k);
    S.events=S.events.filter(e=>e.date!==k);
    S.days[k]=newDay();
    const ok=save(),verified=ok&&verifyDayEmpty(k);
    if(!verified){S=before;save();render();toast('Reset failed. Your day was restored.');return}
    render();toast('Day reset',true);
  }});
}
function resetMonth(){
  const mk=cur;
  ask({title:'Reset '+monthName(mk)+'?',msg:'This removes all tasks, events and day records in this month. Other months, routines, exams and backlog are kept, and so is this month\'s target. A temporary backup will be created so you can Undo.',ok:'Reset month',cb:()=>{
    rememberUndo('Month reset');
    const before=cloneState(S);
    S.tasks=S.tasks.filter(t=>mkey(t.date)!==mk);
    S.events=S.events.filter(e=>mkey(e.date)!==mk);
    Object.keys(S.days).forEach(k=>{if(mkey(k)===mk)delete S.days[k]});
    const ok=save(),verified=ok&&verifyMonthEmpty(mk);
    if(!verified){S=before;save();render();toast('Reset failed. Your month was restored.');return}
    render();toast('Month reset',true);
  }});
}
function resetEverything(){
  ask({title:'Reset everything?',msg:'This will permanently delete all planner data from this browser. A temporary backup will be created so you can Undo.\nType RESET to confirm.',input:'',ok:'Reset everything',cb:v=>{
    if(String(v).trim()!=='RESET'){toast('Nothing was reset.');return}
    rememberUndo('Everything reset');
    try{localStorage.removeItem(KEY)}catch(e){}
    const removed=!storeOK||localStorage.getItem(KEY)===null;
    if(!removed){toast('Reset failed. Your data is still intact.');return}
    S=blank();sel=today();cur=mkey(sel);view='month';
    render();toast('Everything was reset',true);
  }});
}

/* ===== REMINDERS (no planner data is changed) ===== */
let fired=new Set();
try{fired=new Set(JSON.parse(sessionStorage.getItem('planner-fired')||'[]'))}catch(e){}
function checkReminders(){
  const now=Date.now(),k=today();
  S.events.forEach(e=>{
    if(e.reminder==null||e.date!==k||!e.time) return;
    const a=e.time.split(':').map(Number),st=parse(k);st.setHours(a[0],a[1],0,0);
    const start=st.getTime(),at=start-e.reminder*6e4,end=e.reminder===0?start+12e4:start,id=e.id+k+e.time+e.reminder;
    if(now>=at&&now<end&&!fired.has(id)){
      fired.add(id);
      try{sessionStorage.setItem('planner-fired',JSON.stringify([...fired]))}catch(_){}
      if('Notification' in window&&Notification.permission==='granted'){try{new Notification('Coming up: '+e.title,{body:'Starts at '+e.time})}catch(_){toast('Coming up: '+e.title+' at '+e.time)}}
      else toast('Coming up: '+e.title+' at '+e.time);
    }
  });
}

function loadTheme(){try{const x=JSON.parse(localStorage.getItem(THEME_KEY)||'null');if(x&&typeof x==='object'){themePrefs.theme=['midnight','purple','matrix','gold','arctic','crimson'].includes(x.theme)?x.theme:'midnight';themePrefs.mode=x.mode==='light'?'light':'dark';themePrefs.accent=typeof x.accent==='string'?x.accent:''}}catch(_){}applyTheme()}
function saveTheme(){try{localStorage.setItem(THEME_KEY,JSON.stringify(themePrefs))}catch(_){}}
function applyTheme(){document.documentElement.dataset.theme=themePrefs.theme;document.documentElement.dataset.mode=themePrefs.mode;if(themePrefs.accent)document.documentElement.style.setProperty('--acc',themePrefs.accent);else document.documentElement.style.removeProperty('--acc');const selEl=$('#themeSelect'),mode=$('#modeBtn'),pickEl=$('#accentPicker');if(selEl)selEl.value=themePrefs.theme;if(mode)mode.textContent=themePrefs.mode==='light'?'☀':'☾';if(pickEl)pickEl.value=themePrefs.accent||themeAccent(themePrefs.theme);renderMiniRing()}
function themeAccent(t){return ({midnight:'#35bfff',purple:'#b56cff',matrix:'#39e67a',gold:'#d7ad45',arctic:'#42d9ff',crimson:'#ff4f68'})[t]||'#b78cff'}
function completionFor(k){const ts=S.tasks.filter(t=>t.date===k),done=ts.filter(t=>t.completed).length;return {total:ts.length,done,percent:ts.length?Math.round(done/ts.length*100):0}}
function carryOverTasks(){
  const k=today();
  return S.tasks.filter(t=>t.date<k&&!t.completed&&!t.carryDismissed).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:PR.indexOf(a.priority)-PR.indexOf(b.priority));
}
function moveCarryToToday(){
  const list=carryOverTasks();
  if(!list.length){toast('No unfinished tasks to carry over.');return}
  rememberUndo('Carry-over');
  list.forEach(t=>{t.date=today();delete t.carryDismissed});
  commit(list.length+' unfinished task'+(list.length>1?'s':'')+' moved to today',true);
}
function dismissCarry(){
  const list=carryOverTasks();
  if(!list.length){toast('No unfinished tasks to leave.');return}
  rememberUndo('Dismiss carry-over');
  list.forEach(t=>{t.carryDismissed=true});
  commit('Carry-over left on previous days',true);
}
function moveTaskTo(id,date,label){
  const t=S.tasks.find(x=>x.id===id);
  if(!t||t.completed)return;
  rememberUndo('Move task');
  t.date=date;
  delete t.carryDismissed;
  commit(label||'Task moved',true);
}
function moveTaskToToday(id){moveTaskTo(id,today(),'Task moved to today')}
function moveTaskToTomorrow(id){moveTaskTo(id,addDays(today(),1),'Task moved to tomorrow')}

function ringHTML(percent,sizeClass){const r=24,c=2*Math.PI*r,off=c-(Math.max(0,Math.min(100,percent))/100)*c;return '<div class="ring '+(sizeClass||'')+'" aria-label="'+percent+' percent complete"><svg viewBox="0 0 56 56"><circle class="track" cx="28" cy="28" r="'+r+'"></circle><circle class="fill" cx="28" cy="28" r="'+r+'" stroke-dasharray="'+c.toFixed(2)+'" stroke-dashoffset="'+off.toFixed(2)+'"></circle></svg><span class="rtext">'+percent+'%</span></div>'}
function renderMiniRing(){const el=$('#todayMiniRing');if(el){const x=completionFor(today());el.innerHTML=ringHTML(x.percent)}}

/* ===== DATA EXPORT / IMPORT ===== */
function exportData(){
  const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download='arq-planner-backup-'+today()+'.json';
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  toast('Backup exported');
}
function importData(file){
  if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const imported=normalizeData(JSON.parse(reader.result));
      ask({title:'Import this backup?',msg:'Importing will replace the planner data currently in this browser. Your current data will be backed up first. Type IMPORT to confirm.',input:'',ok:'Import',cb:v=>{
        if(String(v).trim()!=='IMPORT'){toast('Nothing was imported.');return}
        rememberUndo('Before import');
        const before=cloneState(S);S=imported;
        if(!save()){S=before;save();render();toast('Import failed. Your current data was restored.');return}
        render();toast('Planner data imported',true);
      }});
    }catch(e){toast('That file is not a valid planner JSON backup.')}
  };
  reader.onerror=()=>toast('Could not read that file.');
  reader.readAsText(file);
}

/* ===== EVENT LISTENERS ===== */
const A={
  nav:(id,el)=>go(el.dataset.v),
  day:id=>{pick(id);go('day')},
  today:()=>{pick(today());go('day')},
  pm:()=>{cur=shiftMonth(cur,-1);render()},
  nm:()=>{cur=shiftMonth(cur,1);render()},
  flt:id=>{filt=id;render()},
  dp:()=>{pick(addDays(sel,-1));render()},
  dn:()=>{pick(addDays(sel,1));render()},
  toggle:id=>{const t=S.tasks.find(x=>x.id===id);if(!t)return;t.completed=!t.completed;commit(t.completed?'Task completed':'Marked as not done')},
  cyc:id=>{const t=S.tasks.find(x=>x.id===id);if(!t)return;t.priority=PR[(PR.indexOf(t.priority)+1)%3];commit()},
  edit:id=>rename('tasks',id,'Edit task'),
  del:id=>{S.tasks=S.tasks.filter(x=>x.id!==id);commit('Task deleted')},
  ach0:()=>setAchievement(0),
  achx:()=>{if(S.days[sel]){S.days[sel].achievement=null;commit()}},
  light:()=>{const d=ensureDay(sel);d.light=!d.light;commit()},
  other:()=>{const d=ensureDay(sel);d.other=!d.other;commit(d.other?'Marked as Other day':'Other day removed')},
  gen:()=>generateRoutine(sel),
  rday:resetDay,
  evnew:()=>openEvent(null),
  evedit:id=>openEvent(id),
  evcancel:closeEvent,
  cdno:()=>{cbOK=null;closeDlg('#cd')},
  evcat:id=>{evCat=id;drawCats()},
  evdel:id=>{S.events=S.events.filter(x=>x.id!==id);commit('Event deleted')},
  exedit:id=>rename('exams',id,'Rename countdown'),
  exdel:id=>{S.exams=S.exams.filter(x=>x.id!==id);commit('Countdown removed')},
  rtedit:id=>rename('routines',id,'Rename routine item'),
  rtdel:id=>{S.routines=S.routines.filter(x=>x.id!==id);commit('Routine item removed')},
  rtday:(id,el)=>{const r=S.routines.find(x=>x.id===id);if(!r)return;const d=+el.dataset.d,i=r.daysOfWeek.indexOf(d);if(i>-1)r.daysOfWeek.splice(i,1);else{r.daysOfWeek.push(d);r.daysOfWeek.sort()}commit()},
  bltoday:id=>moveBacklog(id,today()),
  blsel:id=>moveBacklog(id,sel),
  bldel:id=>{S.backlog=S.backlog.filter(x=>x.id!==id);commit('Removed from backlog')},
  export:exportData,
  import:()=>$('#importFile').click(),
  undo:restoreUndo,
  carryall:moveCarryToToday,
  carryleave:dismissCarry,
  moveToday:moveTaskToToday,
  moveTomorrow:moveTaskToTomorrow,
  rmonth:resetMonth,
  rall:resetEverything,
  mode:()=>{themePrefs.mode=themePrefs.mode==='light'?'dark':'light';saveTheme();applyTheme()},
  theme:()=>{}
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(!el)return;
  const f=A[el.dataset.act];
  if(f)f(el.dataset.id,el);
});

const F={
  cdf:()=>{const fn=cbOK,i=$('#cdi'),v=i.hidden?true:i.value;cbOK=null;closeDlg('#cd');if(fn)fn(v)},
  tf:f=>{
    const E=f.elements;
    lastPrio=E.prio.value;
    if(!addTask(E.title.value,lastPrio,sel))return;
    commit('Task added');
    const i=$('#tf [name=title]');if(i)i.focus();
  },
  evf:f=>{
    const E=f.elements,title=E.title.value.trim(),time=E.time.value,date=E.dt.value;
    if(!title||!time||!date){toast('Add a title, date and start time.');return}
    const o={title:title,date:date,time:time,duration:Math.max(5,parseInt(E.dur.value,10)||60),category:evCat,reminder:E.rem.value===''?null:+E.rem.value};
    const editing=E.eid.value;
    if(editing){const ev=S.events.find(x=>x.id===editing);if(ev)Object.assign(ev,o)}
    else S.events.push(Object.assign({id:uid()},o));
    if(o.reminder!==null&&'Notification' in window&&Notification.permission==='default'){try{Notification.requestPermission()}catch(_){}}
    closeEvent();
    pick(date);
    commit(editing?'Event updated':'Event added');
  },
  rtf:f=>{
    const E=f.elements,title=E.title.value.trim(),days=[...f.querySelectorAll('input[name=d]:checked')].map(x=>+x.value);
    if(!title)return;
    if(!days.length){toast('Pick at least one weekday.');return}
    S.routines.push({id:uid(),title:title,daysOfWeek:days});
    commit('Routine item added');
  },
  blf:f=>{
    const E=f.elements,title=E.title.value.trim();
    if(!title)return;
    S.backlog.push({id:uid(),title:title,priority:E.prio.value});
    commit('Added to backlog');
  },
  exf:f=>{
    const E=f.elements,name=E.nm.value.trim(),date=E.dt.value;
    if(!name||!date)return;
    S.exams.push({id:uid(),name:name,date:date});
    commit('Countdown added');
  }
};
document.addEventListener('submit',e=>{
  e.preventDefault();
  const fn=F[e.target.id];
  if(fn)fn(e.target);
});

let noteTimer=null;
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='ach'){$('#aout').textContent=t.value+'%';const b=$('#pb');if(b)b.style.width=t.value+'%';return}
  if(t.id==='tgt'){$('#tout').textContent=t.value+'%';return}
  if(t.dataset&&t.dataset.field){
    if(!t.value&&!S.days[sel])return;
    ensureDay(sel)[t.dataset.field]=t.value;
    clearTimeout(noteTimer);
    noteTimer=setTimeout(()=>{if(!save())toast('Could not save your notes.')},350);
  }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='themeSelect'){themePrefs.theme=t.value;themePrefs.accent='';saveTheme();applyTheme();toast('Theme: '+t.options[t.selectedIndex].text);return}
  if(t.id==='accentPicker'){themePrefs.accent=t.value;saveTheme();applyTheme();toast('Accent updated');return}
  if(t.id==='ach'){setAchievement(+t.value);const s=$('#ach');if(s)s.focus()}
  else if(t.id==='tgt'){S.monthlyTargets[cur]=+t.value;commit('Target saved for '+monthName(cur));const s=$('#tgt');if(s)s.focus()}
  else if(t.id==='importFile'){const f=t.files&&t.files[0];if(f)importData(f);t.value=''}
  else if(t.dataset&&t.dataset.chg==='exdate'){const x=S.exams.find(z=>z.id===t.dataset.id);if(x&&t.value){x.date=t.value;commit('Date updated')}}
});
$('#toastUndo').addEventListener('click',restoreUndo);
document.addEventListener('keydown',e=>{
  const tg=e.target,tag=tg&&tg.tagName;
  if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT'||(tg&&tg.isContentEditable)||e.ctrlKey||e.metaKey||e.altKey)return;
  const k=e.key.toLowerCase();
  if(k==='m')go('month');
  else if(k==='d')go('day');
  else if(k==='t'){pick(today());go('day')}
});
window.addEventListener('storage',e=>{
  if(e.key===KEY||e.key===null){S=load();render()}
});

/* ===== INITIALIZATION ===== */
window.addEventListener('error',e=>{try{toast('Error: '+e.message)}catch(_){}});
$('#cd').addEventListener('close',()=>{cbOK=null});
S=load();
loadTheme();
render();
if(warn)toast(warn);
checkReminders();
setInterval(checkReminders,30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkReminders()});
})();
</script>
</body>
</html>
